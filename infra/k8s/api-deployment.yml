# =====================================================================
# QuantNucleo — Kubernetes: API Deployment + Service
# =====================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: quantnucleo
  labels:
    app: quantnucleo
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantnucleo
      component: api
  template:
    metadata:
      labels:
        app: quantnucleo
        component: api
      annotations:
        # Datadog
        ad.datadoghq.com/api.logs: '[{"source":"python","service":"quantnucleo-api"}]'
    spec:
      containers:
        - name: api
          image: ghcr.io/arthur1535/quant-fund-lmf.ufu/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: AMBIENTE
              value: "prod"
            - name: AZURE_KEYVAULT_URL
              valueFrom:
                secretKeyRef:
                  name: quantnucleo-secrets
                  key: azure-keyvault-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: quantnucleo
spec:
  type: LoadBalancer
  selector:
    app: quantnucleo
    component: api
  ports:
    - port: 8000
      targetPort: 8000
