[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantnucleo"
version = "0.1.0"
description = "Núcleo Quantitativo Institucional — LMF/UFU"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Núcleo Quant LMF/UFU"}
]

dependencies = [
    # Core Data
    "polars>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    
    # Finance
    "yfinance>=0.2.36",
    "vectorbt>=0.26.0",
    "pyportfolioopt>=1.5.5",
    "arch>=6.3.0",
    "statsmodels>=0.14.0",
    
    # ML/DL
    "torch>=2.2.0",
    "scikit-learn>=1.4.0",
    
    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    
    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    
    # Data Storage
    "pymongo>=4.6.0",
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.8.0",
    
    # Observability
    "sentry-sdk[fastapi]>=1.40.0",
    "datadog>=0.49.0",
    "ddtrace>=2.5.0",
    "structlog>=24.1.0",
    
    # Utils
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.1.0",
]

research = [
    "tensorflow>=2.15.0",
    "keras>=3.0.0",
    "optuna>=3.5.0",
    "shap>=0.44.0",
    "mlflow>=2.10.0",
]

[project.scripts]
quantnucleo = "libs.core.cli:app"

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["libs", "services", "strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: testes unitários rápidos",
    "integration: testes de integração",
    "backtest: testes de backtesting (lentos)",
    "smoke: smoke tests rápidos de sanidade",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
